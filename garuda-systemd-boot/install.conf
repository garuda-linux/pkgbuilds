# kernel-install(8): one UKI per kernel version in EFI/Linux of the ESP.
# The initrd is the one dracut-install-garuda builds in /boot, passed in by
# /usr/lib/garuda/kernel-install-uki, so 50-dracut.install does not run dracut
# again. Only used on systemd-boot systems, see that script.
layout=uki
uki_generator=ukify
