# ukify(1) settings for the UKIs of kernel-install and the fallback UKIs.
# The kernel command line comes from /etc/kernel/cmdline.
#
# Secure Boot signing is not set up yet. A key goes here later, for example:
#[UKI]
#SecureBootPrivateKey=/etc/kernel/secure-boot.key
#SecureBootCertificate=/etc/kernel/secure-boot.crt
