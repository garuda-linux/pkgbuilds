# snapper-sdboot settings, read as a shell file.

# Free space the snapshot entries leave on the ESP, in MiB. When a new entry
# does not fit, the oldest snapshot entries are dropped first.
FREE_SPACE_FLOOR_MIB=512

# Snapper snapshot types without a boot entry, separated by spaces. The pre
# snapshot of a pacman transaction already shows the state before the change.
SKIP_TYPES="post"
